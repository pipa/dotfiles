# ── General ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g mouse on
set -g escape-time 10              # vim escape-key lag fix
set -g history-limit 100000
set -g focus-events on             # lets nvim autoread work
set -g base-index 1                # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Prefix: C-Space (no readline conflict, ergonomic) ──
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Reload config ──
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Splits open in current pane's cwd ──
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-style pane navigation ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vim-style pane resize (repeatable with -r) ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode: vi bindings + macOS pbcopy ──
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Let tmux own the system clipboard (OSC 52 passthrough)
set -g set-clipboard on

# ── SSH agent forwarding ──
# Refresh env on every attach so reconnecting clients update SSH_AUTH_SOCK for new panes.
# The ~/.ssh/ssh_auth_sock symlink trick (in .zshrc) handles existing panes.
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# ── Catppuccin Mocha status bar (inline, no plugin needed) ──
set -g status-position bottom
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│"
set -g status-right "#[fg=#a6adc8] %a %b %d #[fg=#45475a]│#[fg=#89b4fa] %H:%M "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-format "#[fg=#cdd6f4] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
